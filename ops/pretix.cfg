[pretix]
instance_name=Hefesto Eventos
currency=CLP
datadir=/data
registration=off
password_reset=on
trust_x_forwarded_proto=on
trust_x_forwarded_for=off
allow_http_to_private_networks=off
ecb_rates=off

[database]
backend=postgresql
name=postgres
port=5432
sslmode=verify-full
sslrootcert=/certs/ca.crt
advisory_lock_index=73

[django]
debug=off

[locale]
default=es
timezone=America/Santiago

[redis]
location=redis://redis:6379/0
sessions=false

[celery]
backend=redis://redis:6379/1
broker=redis://redis:6379/2
